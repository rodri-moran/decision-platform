spring:
  flyway:
    baseline-on-migrate: true
  application:
    name: rules-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ruleservicedb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

