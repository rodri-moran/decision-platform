spring:
  flyway:
    baseline-on-migrate: true
  application:
    name: rules-service
  datasource:
    url: jdbc:h2:mem:ruleservicedb
    driver-class-name: org.h2.Driver
    username: ruleservice
    password: ruleservice
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
server:
  port: 8080