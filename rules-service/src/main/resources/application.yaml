spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  flyway:
    baseline-on-migrate: true
  application:
    name: rules-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: true
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

springdoc:
  #  packages-to-scan: com.rodrigomoran.decisionplatform.decision_service.interfaces.rest
  #  show-actuator: true
  swagger-ui:
    path: /swagger-ui.html
#    disable-swagger-default-url: true

