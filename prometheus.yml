global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'audit-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['audit-service:8083']
        labels:
          application: 'audit-service'

  - job_name: 'decision-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['decision-service:8082']
        labels:
          application: 'decision-service'

  - job_name: 'rules-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['rules-service:8081']
        labels:
          application: 'rules-service'